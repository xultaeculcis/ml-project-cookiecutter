repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ "--maxkb=1000" ]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [ "--unsafe" ]  # parse-only: allows custom tags such as the ones in mkdocs.yml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [ tomli ]  # reads [tool.codespell] on Python < 3.11
        # args: [ "--write-changes" ]  # uncomment to fix typos automatically

  # Keep `rev` equal to the `ruff==` pin in pyproject.toml (dev group), so `make format` and this hook agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        types_or: [ python, pyi, jupyter ]
        args: [ "--fix" ]
      - id: ruff-format
        types_or: [ python, pyi, jupyter ]

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          # Do NOT add mdformat-admon: mdformat-mkdocs already formats `!!!` admonitions, and two plugins for the same
          # syntax make the output depend on plugin load order.
          - mdformat-footnote
          - mdformat-frontmatter
          - mdformat-mkdocs
          - mdformat-toc
        args: [ "--number" ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock
{%- if cookiecutter.zizmor == "pre-commit" %}

  # Static security checks for GitHub Actions workflows (runs only when files under .github/ change).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
{%- endif %}

  # mypy and pytest run in the project environment (`uv run`), so they see the real dependencies and their types.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types_or: [ python, pyi ]
        require_serial: true
        pass_filenames: false

      - id: pytest-check
        name: pytest-check
        entry: uv run pytest -m "unit and not slow" -q -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
