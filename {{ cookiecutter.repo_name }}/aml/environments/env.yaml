$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: {{cookiecutter.repo_name}}-env
description: "Training environment for {{cookiecutter.project_name}}."
# Plain Python image with uv. The component command runs `uv run --frozen --no-dev`, which installs the locked
# dependencies from uv.lock when the job starts.
image: ghcr.io/astral-sh/uv:python{{cookiecutter.python_version}}-trixie-slim
{%- if cookiecutter.docker == "yes" %}
# Alternative: build the environment from the project Dockerfile in the workspace container registry. The Dockerfile
# uses BuildKit features (`# syntax=` and `RUN --mount=type=cache`). The Azure ML / ACR image build may not support
# them. If the build fails, build and push the image yourself (`make docker-build`, `docker push`) and set
# `image: <registry>.azurecr.io/{{cookiecutter.repo_name}}:<tag>` instead.
# To use the Dockerfile build, replace `image:` with the `build:` block below, and change the command in
# aml/components/train.yaml to the Dockerfile variant.
# build:
#   path: ../..
#   dockerfile_path: Dockerfile
{%- endif %}
