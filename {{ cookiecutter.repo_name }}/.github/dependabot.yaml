version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days after a release before proposing it. This lowers the risk of pulling a compromised release.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days after a release before proposing it. This lowers the risk of pulling a compromised release.
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
{%- if cookiecutter.docker == "yes" %}

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days after a release before proposing it. This lowers the risk of pulling a compromised release.
    cooldown:
      default-days: 7
    ignore:
      # The Python version of the base image must match `requires-python` and `.python-version`. Change it by hand.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      docker-images:
        patterns:
          - "*"
{%- endif %}
