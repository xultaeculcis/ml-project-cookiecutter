name: nightly

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: false

jobs:
  code-quality:
    name: Code quality (all pre-commit hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
{%- if cookiecutter.ml_stack in ["torch", "lightning"] %}

      # uv installs the CUDA wheels of torch and its NVIDIA dependencies (several GB). Remove preinstalled SDKs that
      # the job does not use, so the runner does not run out of disk space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
{%- endif %}

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-{% raw %}${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}{% endraw %}
          restore-keys: pre-commit-{% raw %}${{ runner.os }}{% endraw %}-

      # All hooks. The `pytest-check` hook is skipped because the `tests` job runs the full test suite with coverage
      # and JUnit output.
      - name: Run pre-commit hooks
        env:
          SKIP: pytest-check
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

  tests:
    name: Tests (all except GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Each xdist worker would otherwise start a BLAS thread pool with one thread per core.
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
{%- if cookiecutter.ml_stack in ["torch", "lightning"] %}

      # uv installs the CUDA wheels of torch and its NVIDIA dependencies (several GB). Remove preinstalled SDKs that
      # the job does not use, so the runner does not run out of disk space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
{%- endif %}

      - name: Sync environment
        run: uv sync --locked --all-groups

      # Includes slow tests. GPU tests need a GPU runner, so they are excluded.
      - name: Run tests
        run: >
          uv run pytest
          -m "not gpu"
          -n auto
          --cov
          --cov-report=xml
          --junitxml=junit.xml

      - name: Write coverage summary
        if: {% raw %}${{ !cancelled() }}{% endraw %}
        run: |
          {
            echo "## Test coverage (nightly)"
            echo ""
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: {% raw %}${{ !cancelled() }}{% endraw %}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-test-results
          path: |
            junit.xml
            coverage.xml
          retention-days: 14
          if-no-files-found: warn
