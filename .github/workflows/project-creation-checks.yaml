name: project-creation-checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering from any branch

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  project-checks:
    name: project (py${{ matrix.python-version }}, ${{ matrix.options.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        options:
          - name: default
            args: ""
          # `torch: true` marks cells that install the CUDA wheels of torch (several GB).
          - name: lightning-azure-nodocker
            args: "ml_stack=lightning ci_provider=azure docker=no"
            torch: true
          - name: torch-azureml-noagentdocs
            args: "ml_stack=torch azure_ml=yes agent_docs=no"
            torch: true
          - name: nostack-noci-zizmorsarif
            args: "ml_stack=none ci_provider=none zizmor=workflow-sarif"
    env:
      PROJECT_DIR: ${{ github.workspace }}/generated/project-name
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: false

      # Remove preinstalled SDKs that the job does not use, so the CUDA wheels fit on the runner disk.
      - name: Free disk space
        if: ${{ matrix.options.torch }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Generate project from Cookiecutter
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          OPTIONS: ${{ matrix.options.args }}
        run: |
          # OPTIONS is a space separated list of key=value pairs, word splitting is intended
          # shellcheck disable=SC2086
          uvx --from cookiecutter cookiecutter . --no-input -o generated "python_version=${PYTHON_VERSION}" ${OPTIONS}

      - name: Create uv environment and lock file
        run: make init-project
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run pre-commit hooks
        run: make pc
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build docs
        run: make docs
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run tests
        if: ${{ !(matrix.python-version == '3.13' && matrix.options.name == 'default') }}
        run: make test
        working-directory: ${{ env.PROJECT_DIR }}

      # Coverage is uploaded from one matrix cell only.
      - name: Run tests with coverage
        if: ${{ matrix.python-version == '3.13' && matrix.options.name == 'default' }}
        run: uv run pytest -vv --cov=src --cov-report=xml --junitxml=test-results.xml
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.python-version == '3.13' && matrix.options.name == 'default' }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: xultaeculcis/ml-project-cookiecutter
          working-directory: ${{ env.PROJECT_DIR }}
          files: coverage.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.13' && matrix.options.name == 'default' }}
        uses: codecov/test-results-action@47f89e9acb64b76debcd5ea40642d25a4adced9f # v1.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: xultaeculcis/ml-project-cookiecutter
          directory: ${{ env.PROJECT_DIR }}
          files: test-results.xml

  docker-build:
    name: docker build (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PROJECT_DIR: ${{ github.workspace }}/generated/project-name
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: false

      - name: Generate project from Cookiecutter
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uvx --from cookiecutter cookiecutter . --no-input -o generated "python_version=${PYTHON_VERSION}"

      - name: Create lock file
        run: uv lock
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Docker image
        run: docker build -t project-name:ci .
        working-directory: ${{ env.PROJECT_DIR }}
