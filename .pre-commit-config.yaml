# Hooks for the template repository itself. Files inside the template directory contain Jinja, so most hooks skip it.
# The generated project has its own `.pre-commit-config.yaml`.
exclude: '^(\{\{ cookiecutter\.repo_name \}\}/|docs-site/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ '--maxkb=1000' ]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        #args: ["--write-changes"] # uncomment if you want to get automatic fixing

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        types_or: [ python, pyi, jupyter ]
        args: [ "--fix" ]
      - id: ruff-format
        types_or: [ python, pyi, jupyter ]

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-footnote
          - mdformat-frontmatter
          - mdformat-mkdocs
          - mdformat-toc
        # Ignore readme as well, for flexibility
        exclude: '^README.md$'
        args: [ "--number" ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Configuration is in pyproject.toml
        args: []
        additional_dependencies:
          - cookiecutter
          - cruft
          - pytest

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: uv run pytest -m "not slow"
        language: system
        pass_filenames: false
        always_run: true
